<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can I Run It? - Verificador de Jogos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎮 Can I Run It?</h1>
    <p>Insira a memória do seu PC e selecione um jogo do feed!</p>
  </header>

  <main class="container">
    <!-- Configuração do Hardware -->
    <section class="hardware-form">
      <h2>Seu Hardware</h2>
      <div class="input-group">
        <label for="ram">Memória RAM (GB):</label>
        <input type="number" id="ram" placeholder="Ex: 8" value="8">
      </div>
    </section>

    <!-- Barra de Pesquisa -->
    <section class="search-section">
      <input type="text" id="game-search" placeholder="Buscar jogo no feed..." autocomplete="off">
      <button id="btn-search">Buscar</button>
    </section>

    <!-- Feed de Jogos em Cards Retangulares -->
    <section class="feed-header">
      <h2>Feed de Jogos</h2>
    </section>

    <div id="games-feed" class="games-feed">
      <p class="loading">Carregando jogos...</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
